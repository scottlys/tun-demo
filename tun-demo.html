<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tun styreportal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: fast venstremeny med modulene, arbeidsflate med kort i rutenett. Årshjulet og fasadekartet er de to bildene som bærer identiteten. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E9EEED; --line:#D9E0DE; --line-2:#C2CDCA;
  --ink:#14232A; --ink-2:#465A61; --muted:#6B7D84;
  --accent:#1D6B64; --accent-ink:#FFFFFF; --accent-soft:#DCEDEA; --ochre:#B7862B;
  --side-bg:#13262C; --side-ink:#DCE8E6; --side-muted:#8EA6A5; --side-hover:#1B333A; --side-active:#244650; --side-line:#24404A;
  --good:#23794A; --good-soft:#DFF0E5; --warn:#94590A; --warn-soft:#F6EAD3; --crit:#B23A32; --crit-soft:#F7E0DD; --info:#2A5F8F; --info-soft:#DEE9F4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --scrim:rgba(12,24,28,.38); --shadow:0 18px 48px rgba(12,30,36,.22);
  --f-display:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1618; --surface:#152023; --surface-2:#1C2A2E; --line:#27373B; --line-2:#36494E;
    --ink:#E3ECEA; --ink-2:#AFC0BE; --muted:#80959A;
    --accent:#4DB3A7; --accent-ink:#06201D; --accent-soft:#16342F; --ochre:#D8A64A;
    --side-bg:#0A1315; --side-ink:#D6E3E1; --side-muted:#7F9796; --side-hover:#13232A; --side-active:#1A353C; --side-line:#1A2B30;
    --good:#5DC08A; --good-soft:#15301F; --warn:#E2A548; --warn-soft:#33260F; --crit:#EE7E73; --crit-soft:#3A1D1A; --info:#7DB2E8; --info-soft:#15283A;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --scrim:rgba(0,0,0,.55); --shadow:0 18px 48px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#152023; --surface-2:#1C2A2E; --line:#27373B; --line-2:#36494E;
  --ink:#E3ECEA; --ink-2:#AFC0BE; --muted:#80959A;
  --accent:#4DB3A7; --accent-ink:#06201D; --accent-soft:#16342F; --ochre:#D8A64A;
  --side-bg:#0A1315; --side-ink:#D6E3E1; --side-muted:#7F9796; --side-hover:#13232A; --side-active:#1A353C; --side-line:#1A2B30;
  --good:#5DC08A; --good-soft:#15301F; --warn:#E2A548; --warn-soft:#33260F; --crit:#EE7E73; --crit-soft:#3A1D1A; --info:#7DB2E8; --info-soft:#15283A;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --scrim:rgba(0,0,0,.55); --shadow:0 18px 48px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-size:.88em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* Skall */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;gap:20px;padding:22px 14px 18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;letter-spacing:-.02em}
.brand-sub{font-size:12px;color:var(--side-muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.entity{border:1px solid var(--side-line);border-radius:10px;padding:11px 12px;display:grid;gap:2px}
.entity-name{font-weight:600}
.entity-meta{font-size:12.5px;color:var(--side-muted)}
.nav{display:grid;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--side-ink);padding:9px 10px;border-radius:8px;text-align:left;font-size:15px}
.nav-item svg{width:19px;height:19px;flex:none;opacity:.85}
.nav-item:hover{background:var(--side-hover)}
.nav-item.is-active{background:var(--side-active);font-weight:600}
.nav-item.is-active svg{opacity:1;color:var(--ochre)}
.nav-count{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;background:var(--ochre);color:#1a1405;border-radius:999px;padding:0 7px;font-weight:700;line-height:19px}
.role{margin-top:auto;display:grid;gap:7px;padding:0 4px}
.role-label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--side-hover);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:var(--side-ink);padding:7px 0;border-radius:7px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--side-ink);color:var(--side-bg);font-weight:600}

.main{min-width:0}
.wrap{max-width:1320px;margin:0 auto;padding-block:26px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top p{margin:5px 0 0;color:var(--ink-2)}
.top-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px dashed var(--line-2);color:var(--ink-2);border-radius:999px;padding:3px 10px;background:var(--surface)}
.foot{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}

/* Byggesteiner */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.h3{font-size:15px;font-weight:600}
.sub{color:var(--ink-2);font-size:14px;margin:2px 0 0}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.grid-2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;text-align:left;min-width:0}
button.tile:hover{border-color:var(--line-2)}
.tile-k{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile-v{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile-s{font-size:13.5px;color:var(--ink-2)}
.tile.crit .tile-v{color:var(--crit)}
.tile.warn .tile-v{color:var(--warn)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;line-height:1;padding:5px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill svg{width:12px;height:12px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn svg{width:16px;height:16px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:14px}
.link:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:600}
.chip .n{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
.search{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 11px;min-width:0;width:min(320px,100%)}
select.search{width:auto}
.search::placeholder{color:var(--muted)}

dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0;font-size:14.5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* Tabeller */
.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.nowrap{white-space:nowrap}
tr.sum td{font-weight:700;border-bottom:1px solid var(--line-2)}
tr.head td{font-family:var(--f-display);font-weight:600;padding-top:16px;border-bottom:1px solid var(--line-2)}
tr.total td{font-family:var(--f-display);font-weight:700;font-size:16px;border-bottom:0;padding-top:14px}
.pos{color:var(--good)} .neg{color:var(--crit)}

/* Oversikt */
.actions{list-style:none;margin:0;padding:0;display:grid}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0;padding-top:2px}
.act-t{font-weight:600}
.act-s{grid-column:2;color:var(--ink-2);font-size:14px}
.act .link{grid-row:1;grid-column:3;white-space:nowrap}
.agenda{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:2px}
.ag{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.ag:first-child{border-top:0}
.ag-d{font-family:var(--f-display);text-align:center;line-height:1.05;border-radius:8px;background:var(--surface-2);padding:6px 0}
.ag-d b{display:block;font-size:19px}
.ag-d span{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ag-t{font-weight:600}
.ag-s{font-size:13.5px;color:var(--ink-2)}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.c-frist{background:var(--s1);fill:var(--s1)} .c-mote{background:var(--s2);fill:var(--s2)} .c-kontroll{background:var(--s3);fill:var(--s3)}
.mini-list{list-style:none;margin:0;padding:0;display:grid}
.mini-list li{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:3px}
.mini-list li:first-child{border-top:0;padding-top:0}
.mini-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mini-title{font-weight:600}
.mini-meta{font-size:13px;color:var(--muted)}
.progress{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:10px 0 6px}
.progress span{display:block;height:100%;background:var(--accent);border-radius:999px}
.bigline{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}

/* Fasadekart */
.facades{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.facade{display:grid;gap:0}
.roof{height:12px;margin:0 -7px;background:var(--line-2);border-radius:4px 4px 0 0}
.floors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-top:0}
.win{position:relative;aspect-ratio:16/10;border-radius:5px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);display:grid;place-items:center;padding:0}
.win:hover{border-color:var(--ink)}
.win-utleid{background:var(--s1);border-color:var(--s1);color:#fff}
.win-korttid{background:var(--s2);border-color:var(--s2);color:#fff}
.win-dot{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--crit);border:2px solid var(--surface-2)}
.door-row{display:flex;justify-content:center;background:var(--surface-2);border:1px solid var(--line);border-top:0;padding-top:2px;border-radius:0 0 4px 4px}
.door{width:34px;height:26px;border-radius:5px 5px 0 0;background:var(--line-2)}
.facade-label{margin-top:8px;font-weight:600;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line-2)}
.sw.round{border-radius:50%}

/* Utleie */
.req{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:12px}
.req + .req{margin-top:12px}
.req-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.req-actions{display:flex;flex-wrap:wrap;gap:8px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.meter-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 92px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meter-row:first-of-type{border-top:0}
.meter{position:relative;height:14px;border-radius:0 4px 4px 0;background:var(--surface-2)}
.meter-f{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s2)}
.meter-f.over{background:var(--crit)}
.meter-lim{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.meter-cap{font-size:12px;color:var(--muted);margin-top:4px}
.rules{background:var(--surface-2);border-radius:10px;padding:14px 16px;font-size:14.5px;display:grid;gap:8px}
.rules p{margin:0}

/* Dokumenter */
.docs{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.doclist{list-style:none;margin:0;padding:0}
.doc{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.doc:first-child{border-top:0}
.doc:hover{background:var(--surface-2)}
.doc svg{width:22px;height:22px;color:var(--accent)}
.doc-t{font-weight:600;overflow-wrap:anywhere}
.doc-m{font-size:13px;color:var(--muted)}
.empty{padding:22px 4px;color:var(--muted)}
.ask{position:sticky;top:20px;display:grid;gap:12px}
.ask-head{display:flex;gap:10px;align-items:center}
.ask-head svg{width:22px;height:22px;color:var(--ochre)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13.5px;text-align:left}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
.log{display:grid;gap:12px;max-height:440px;overflow-y:auto}
.q{justify-self:end;background:var(--ink);color:var(--surface);border-radius:12px 12px 2px 12px;padding:8px 12px;max-width:90%}
.a{background:var(--surface-2);border-radius:12px 12px 12px 2px;padding:10px 12px;display:grid;gap:8px}
.a p{margin:0}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.src{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12.5px;color:var(--accent);font-weight:600;text-align:left}
.ask form{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 11px}
.fine{font-size:12.5px;color:var(--muted);margin:0}

/* Styret */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.person{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;background:var(--surface)}
.person-top{display:flex;gap:12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.person-name{font-weight:700}
.person-c{font-size:13.5px;color:var(--ink-2);display:grid;gap:2px}
.person-c span{overflow-wrap:anywhere}
.new-row td{background:var(--accent-soft)}

/* Årshjul */
.wheel-wrap{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:20px;align-items:start}
.wheel{width:100%;height:auto;display:block;max-width:430px;margin:0 auto}
.wseg{fill:var(--surface-2);stroke:none}
.wseg.is-now{fill:var(--accent-soft)}
.wlab{font:600 12.5px var(--f-body);fill:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.wneedle{stroke:var(--ochre);stroke-width:2;stroke-linecap:round}
.wneedle-hub{fill:var(--ochre)}
.wdot{stroke:var(--surface);stroke-width:2.5;cursor:pointer}
.wdot.is-sel{stroke:var(--ink);stroke-width:3}
.wc1{font:600 12px var(--f-body);fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.wc2{font:700 21px var(--f-display);fill:var(--ink)}
.wc3{font:500 13px var(--f-body);fill:var(--ink-2)}
.month-block + .month-block{margin-top:6px}
.month-h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 0 4px}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:8px 8px;border-radius:8px;align-items:start}
.ev.is-sel{background:var(--accent-soft)}
.ev-d{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:14px}
.ev-t{font-weight:600}
.ev-s{font-size:13.5px;color:var(--ink-2)}

/* Regnskap */
.hbars{display:grid;gap:7px}
.hbar{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:14px;border-radius:6px;padding:2px 0}
.hbar:hover .hbar-f,.hbar:focus .hbar-f{filter:brightness(1.1)}
.hbar-l{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-t{height:16px;position:relative}
.hbar-f{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hbar-v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .baseline{stroke:var(--line-2);stroke-width:1}
.chart .axis{font:500 12px var(--f-body);fill:var(--muted)}

.yr-note{font-size:13px;color:var(--muted);margin-top:8px}

/* Min side */
.pay-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pay{display:grid;gap:3px;justify-items:center;font-size:12px;color:var(--muted);min-width:42px}
.pay i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--good-soft);color:var(--good);font-style:normal;font-weight:700}
textarea{width:100%;min-height:96px;border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;background:var(--surface);resize:vertical}
label.f{display:grid;gap:5px;font-weight:600;font-size:14px}
.form{display:grid;gap:10px}

/* Pliktsjekk, næringsseksjon, lenke mellom demoene */
a.badge{text-decoration:none;color:var(--accent);border-style:solid;border-color:var(--accent);font-weight:600}
a.badge:hover{background:var(--accent-soft)}
.win-naering{background:repeating-linear-gradient(135deg,var(--surface) 0 5px,var(--surface-2) 5px 10px);border-style:dashed;color:var(--ink)}
.plikter{display:grid}
.plikt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.plikt:first-child{border-top:0;padding-top:0}
.plikt-t{font-weight:600}
.plikt-s{grid-column:1;font-size:13.5px;color:var(--ink-2)}
.plikt .pill{grid-column:2;grid-row:1}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);overflow-y:auto;padding:22px max(22px,env(safe-area-inset-right,0px)) 30px 22px;padding-top:max(22px,env(safe-area-inset-top,0px));display:grid;gap:18px;align-content:start}
.drawer-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.drawer h2{font-size:24px;letter-spacing:-.02em}
.x{border:0;background:var(--surface-2);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.dsec{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:14px}
.preview{border:1px solid var(--line);border-radius:8px;padding:22px 24px;display:grid;gap:9px;background:var(--bg)}
.preview i{display:block;height:8px;border-radius:4px;background:var(--line)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;padding:6px 9px;border-radius:7px;max-width:280px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(22px,env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:min(560px,calc(100% - 32px));font-size:14.5px}

function agendaItems(limitDays) {

  return [...EVENTS, ...dyn].filter(e => daysTo(e.d) >= 0 && (limitDays == null || daysTo(e.d) <= limitDays)).sort((a, b) => D(a.d) - D(b.d));
}

function buildActions() {
  const a = [];
  KORTTID.forEach(k => {
    const n = nights(k);
    if (n > RULES.korttidGrense) a.push({ sev: 'crit', t: `${k.enhet} har ${n} døgn korttidsutleie i 2026`, s: `Grensen er ${RULES.korttidGrense} døgn. Varsel er sendt (sak 24/26), og svar ventes innen 20. november.`, go: 'utleie' });
    else if (n >= RULES.korttidGrense - 5) a.push({ sev: 'warn', t: `${k.enhet} nærmer seg grensen for korttidsutleie`, s: `${n} av ${RULES.korttidGrense} døgn er brukt i år.`, go: 'utleie' });
  });
  units.filter(u => u.bet === 'purret').forEach(u => a.push({ sev: 'crit', t: `${u.id} skylder for oktober og november`, s: `${kr(u.belop * 2)} er utestående, og andre purring er sendt.`, go: 'faktura' }));
  S.soknader.filter(s => s.status === 'til behandling').sort((x, y) => D(x.frist) - D(y.frist)).forEach(s => a.push({ sev: 'warn', t: `Utleiesøknaden fra ${s.enhet} må besvares`, s: `Svarfrist ${fdm(s.frist)}, om ${daysTo(s.frist)} dager. ${RULES.svarfrist}`, go: 'utleie' }));
  S.henv.filter(h => h.status === 'Ny').forEach(h => a.push({ sev: 'warn', t: `Ny henvendelse: ${h.emne}`, s: `Fra ${h.fra} i ${h.enhet}, ${fdm(h.dato)}.`, go: 'henv' }));
  LANGTID.forEach(l => { const d = daysTo(l.til); if (d >= 0 && d <= 60) a.push({ sev: 'info', t: `Leieavtalen i ${l.enhet} går ut ${fdm(l.til)}`, s: `Om ${d} dager. Andelseieren må søke på nytt hvis utleien skal fortsette.`, go: 'utleie' }); });
  const o = { crit: 0, warn: 1, info: 2 };
  return a.sort((x, y) => o[x.sev] - o[y.sev]);
}

function ask(q) {

}

const PLIKT_SUB = 'Tun leser dette ut fra organisasjonsformen. For et sameie ser listen annerledes ut.';

function pliktCard() {

}
function arc(cx, cy, r0, r1, a0, a1) {
  const p = (r, a) => `${(cx + r * Math.cos(a * Math.PI / 180)).toFixed(2)} ${(cy + r * Math.sin(a * Math.PI / 180)).toFixed(2)}`;
  return `M${p(r1, a0)} A${r1} ${r1} 0 0 1 ${p(r1, a1)} L${p(r0, a1)} A${r0} ${r0} 0 0 0 ${p(r0, a0)} Z`;
}
function wheel(ev) {
  const cx = 200, cy = 200, R0 = 138, R1 = 180;
  const MN = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
  let s = '';
  for (let m = 0; m < 12; m++) {
    const a0 = m * 30 - 90, a1 = (m + 1) * 30 - 90, am = (a0 + a1) / 2 * Math.PI / 180, rm = (R0 + R1) / 2;
    s += `<path d="${arc(cx, cy, R0, R1, a0 + .7, a1 - .7)}" class="wseg${m === TODAY.getMonth() ? ' is-now' : ''}"/>`;
    s += `<text x="${(cx + Math.cos(am) * rm).toFixed(1)}" y="${(cy + Math.sin(am) * rm).toFixed(1)}" class="wlab" text-anchor="middle" dominant-baseline="central">${MN[m]}</text>`;
  }
  const frac = d => { const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return (d.getMonth() + (d.getDate() - .5) / dim) / 12; };
  const ta = (frac(TODAY) * 360 - 90) * Math.PI / 180;
  s += `<line x1="${(cx + Math.cos(ta) * 66).toFixed(1)}" y1="${(cy + Math.sin(ta) * 66).toFixed(1)}" x2="${(cx + Math.cos(ta) * (R1 + 8)).toFixed(1)}" y2="${(cy + Math.sin(ta) * (R1 + 8)).toFixed(1)}" class="wneedle"/>`;
  const placed = [];
  ev.forEach((e, i) => {
    const ang = frac(D(e.d)) * 360 - 90;
    let r = 120; while (placed.some(p => Math.abs(p.ang - ang) < 6.5 && p.r === r)) r -= 17;
    placed.push({ ang, r });
    const rad = ang * Math.PI / 180;
    s += `<circle cx="${(cx + Math.cos(rad) * r).toFixed(1)}" cy="${(cy + Math.sin(rad) * r).toFixed(1)}" r="7.5" class="wdot c-${e.c}${S.selEvent === i ? ' is-sel' : ''}" data-action="wheel" data-i="${i}" tabindex="0" role="button" aria-label="${esc(fdm(e.d) + ': ' + e.t)}" data-tip="${esc(fdm(e.d) + ': ' + e.t)}"/>`;
  });
  const nx = ev[0];
  s += `<text x="${cx}" y="${cy - 26}" class="wc1" text-anchor="middle">I dag</text><text x="${cx}" y="${cy + 2}" class="wc2" text-anchor="middle">${fdm(iso(TODAY))}</text><text x="${cx}" y="${cy + 26}" class="wc3" text-anchor="middle">Neste om ${daysTo(nx.d)} dager</text>`;
  return `<svg viewBox="0 0 400 400" class="wheel" role="img" aria-label="Årshjul med ${ev.length} hendelser">${s}</svg>`;
}

function luhn(num) { let sum = 0, dbl = true; for (let i = num.length - 1; i >= 0; i--) { let d = +num[i]; if (dbl) { d *= 2; if (d > 9) d -= 9; } sum += d; dbl = !dbl; } return (10 - sum % 10) % 10; }
const kid = (andel, ym) => { const b = '4417' + String(andel).padStart(3, '0') + ym; return b + luhn(b); };

  const prev = yi > 0 ? [sumI(yi - 1), sumK(yi - 1), sumI(yi - 1) - sumK(yi - 1), DISP[yi - 1], GJELD[yi - 1]] : [];
  return `

    ${tile('Disponible midler', kr(DISP[yi]), `Per 31. desember ${S.year}`, 'regnskap')}

  </div>
  <section class="card">

    <div class="tbl"><table><thead><tr><th>Post</th><th class="r">${prog ? 'Prognose' : 'Regnskap'}</th><th class="r">Budsjett</th><th class="r">Avvik</th></tr></thead><tbody>
      <tr class="head"><td colspan="4">Inntekter</td></tr>

      <tr class="head"><td colspan="4">Kostnader</td></tr>
      ${Object.entries(KOST).filter(([, v]) => v[yi] > 0).map(([k, v]) => row(k, v[yi], budget(k, v[yi], yi), -1)).join('')}

function row(k, v, b, dir, cls = '') {
  const av = v - b, good = av * dir >= 0;
  return `<tr class="${cls}"><td>${k}</td><td class="r">${nf(v)}</td><td class="r">${nf(b)}</td><td class="r ${av === 0 ? '' : good ? 'pos' : 'neg'}">${av === 0 ? '0' : (av > 0 ? '+' : '−') + nf(Math.abs(av))}</td></tr>`;
}
function costBars(yi) {
  const rows = Object.entries(KOST).map(([k, v]) => [k, v[yi], yi > 0 ? v[yi - 1] : 0]).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]);
  const max = rows[0][1], tot = rows.reduce((s, r) => s + r[1], 0);
  return `<div class="hbars">${rows.map(([k, v, p]) => `<div class="hbar" tabindex="0" data-tip="${esc(`${k}: ${kr(v)}, ${pct(v / tot)} av kostnadene${p ? `, ${v >= p ? '+' : ''}${pct((v - p) / p)} fra ${YEARS[yi - 1]}` : ''}`)}"><span class="hbar-l">${k}</span><span class="hbar-t"><span class="hbar-f" style="width:${(v / max * 100).toFixed(1)}%"></span></span><span class="hbar-v">${nf(v)}</span></div>`).join('')}</div>`;
}
function topRounded(x, y, w, h, r) { r = Math.min(r, h, w / 2); return `M${x.toFixed(1)} ${(y + h).toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)}H${(x + w - r).toFixed(1)}Q${(x + w).toFixed(1)} ${y.toFixed(1)} ${(x + w).toFixed(1)} ${(y + r).toFixed(1)}V${(y + h).toFixed(1)}Z`; }
function yearsChart() {
  const W = 560, H = 270, pl = 56, pr = 10, pt = 14, pb = 50, max = 3e6, iw = W - pl - pr, ih = H - pt - pb;
  const y = v => pt + ih - v / max * ih;
  let g = '';
  [0, 1e6, 2e6, 3e6].forEach(t => { g += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${pl - 8}" y="${y(t)}" class="axis" text-anchor="end" dominant-baseline="central">${t ? (t / 1e6) + ' mill.' : '0'}</text>`; });
  const gw = iw / YEARS.length, bw = Math.min(32, gw * .32);
  YEARS.forEach((yr, i) => {
    const inn = sumI(i), kos = sumK(i), cx = pl + gw * i + gw / 2, sel = yr === S.year;
    [[inn, 's1', 'Inntekter'], [kos, 's2', 'Kostnader']].forEach(([v, c, l], j) => {
      const x = j === 0 ? cx - bw - 1 : cx + 1;
      g += `<path d="${topRounded(x, y(v), bw, y(0) - y(v), 4)}" class="bar ${c}${sel ? '' : ' dim'}" data-action="year" data-v="${yr}" data-tip="${esc(`${l} ${yr}${yr === 2026 ? ' (prognose)' : ''}: ${kr(v)}`)}"/>`;
    });
    g += `<text x="${cx}" y="${H - pb + 19}" class="axis${sel ? ' strong' : ''}" text-anchor="middle">${yr}${yr === 2026 ? '*' : ''}</text><text x="${cx}" y="${H - pb + 36}" class="axis small" text-anchor="middle">+${nf(Math.round((inn - kos) / 1000) * 1000)}</text>`;
  });
  g += `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" class="baseline"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Inntekter og kostnader 2022 til 2026">${g}</svg>`;
}

function decide(id, ok) {
  const s = S.soknader.find(x => x.id === id); const nr = nextSak();
  s.status = ok ? 'godkjent' : 'avslått'; s.sak = nr;
  S.vedtak.unshift({ sak: nr, dato: iso(TODAY), tittel: ok ? `Godkjent utleie av ${s.enhet}, ${s.periode}` : `Avslag på utleiesøknad fra ${s.enhet}`, status: 'Utført', ansvar: 'C-H0301', ny: true });
  DOCS.push(doc('utleie', `${ok ? 'Godkjent' : 'Avslått'} utleie ${s.enhet}`, iso(TODAY), '36 kB', false));
  if (ok) { const [fra, til] = s.enhet === 'A-H0302' ? ['2027-01-01', '2027-12-31'] : ['2027-01-01', '2027-06-30']; LANGTID.push({ enhet: s.enhet, leietaker: s.leietaker, kontakt: s.kontakt, fra, til, sak: nr }); unit(s.enhet).bruk = 'utleid'; }
  toast(`Vedtak ${nr} er lagt i vedtaksregisteret, og svarbrevet ligger i arkivet. I demoen sendes ingenting.`);
  render();
}

    <div class="role"><div class="role-label">Vis som</div><div class="seg" role="group" aria-label="Vis som"><button data-action="role" data-role="styret" aria-pressed="${S.role === 'styret'}">Styret</button><button data-action="role" data-role="beboer" aria-pressed="${S.role === 'beboer'}">Beboer</button></div></div>`;
}
const VIEWS = { oversikt: vOversikt, enheter: vEnheter, utleie: vUtleie, dokumenter: vDokumenter, styret: vStyret, arshjul: vArshjul, faktura: vFaktura, regnskap: vRegnskap, minside: vMinside };
function render() {
  renderSide();
  const [h, p] = HEAD[S.view];
  $('top').innerHTML = `<div><h1>${h}</h1><p>${p}</p></div><div class="top-meta"><span class="badge">Eksempeldata, fiktivt borettslag</span><span class="badge">Demodato ${fd(iso(TODAY))}</span><a class="badge" href="tun-oppstart.html">Se oppstarten</a><a class="badge" href="tun-demo-sameie.html">Se sameieversjonen</a></div>`;
  $('view').innerHTML = VIEWS[S.view]();
  document.title = `${h} · Tun styreportal`;
}
function setView(v) {
  const allowed = (S.role === 'styret' ? NAV_STYRE : NAV_BEBOER).some(n => n.id === v);
  if (!allowed) return;
  S.view = v; S.selEvent = null; render(); window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + v); } catch (e) { }
}

/* ---------- Hendelser ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action, v = el.dataset.v;
  if (a === 'nav') setView(el.dataset.view);
  else if (a === 'role') { S.role = el.dataset.role; S.view = S.role === 'styret' ? 'oversikt' : 'minside'; S.askLog = []; S.docCat = 'alle'; S.docYear = 'alle'; S.docQuery = ''; render(); window.scrollTo(0, 0); try { history.replaceState(null, '', '#' + S.view); } catch (err) { } }
  else if (a === 'unit') openUnit(el.dataset.id);
  else if (a === 'doc') openDoc(el.dataset.id);
  else if (a === 'close') closeDrawer();
  else if (a === 'ufilter') { S.unitFilter = v; render(); }
  else if (a === 'dcat') { S.docCat = v; document.querySelectorAll('[data-action="dcat"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); $('docList').innerHTML = docList(); }
  else if (a === 'vfilter') { S.vedtakFilter = v; render(); }
  else if (a === 'ifilter') { S.invFilter = v; render(); }
  else if (a === 'year') { S.year = +v; render(); }
  else if (a === 'approve' || a === 'reject') decide(el.dataset.id, a === 'approve');
  else if (a === 'ask') ask(el.dataset.q);
  else if (a === 'toast') toast(el.dataset.msg);
  else if (a === 'desember') { S.desemberKlar = true; render(); toast(`36 fakturaer for desember er klare, til sammen ${kr(units.reduce((s, u) => s + u.belop, 0))}. De sendes 15. november. I demoen sendes ingenting.`); }
  else if (a === 'wheel') { S.selEvent = +el.dataset.i; render(); document.getElementById('ev' + el.dataset.i)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  else if (a === 'scroll') document.getElementById(el.dataset.target)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('drawer').hidden) closeDrawer();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.doc,.wdot')) { e.preventDefault(); e.target.click ? e.target.click() : e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'unitSearch') { S.unitQuery = e.target.value; $('unitTable').innerHTML = unitTable(); }
  if (e.target.id === 'docSearch') { S.docQuery = e.target.value; $('docList').innerHTML = docList(); }
});
document.addEventListener('change', e => { if (e.target.id === 'docYear') { S.docYear = e.target.value; $('docList').innerHTML = docList(); } });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'askForm') { const i = $('askInput'); ask(i.value); i.value = ''; }
  if (e.target.id === 'msgForm') {
    const t = $('msgText').value.trim(); if (!t) return;
    S.henv.unshift({ fra: 'Hanne Myrvold', enhet: ME, emne: t.length > 70 ? t.slice(0, 67) + '...' : t, dato: iso(TODAY), status: 'Ny' });
    $('msgText').value = '';
    toast('Meldingen er sendt til styret. Bytt til «Styret» nede i menyen for å se den på oversikten.');
  }
});
/* Verktøytips */
const tip = $('tip');
function showTip(el, x, y) { tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(); tip.style.left = Math.min(window.innerWidth - r.width - 8, Math.max(8, x + 14)) + 'px'; tip.style.top = Math.max(8, y - r.height - 12) + 'px'; }
document.addEventListener('mousemove', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } });
document.addEventListener('focusout', () => tip.hidden = true);
window.addEventListener('scroll', () => tip.hidden = true, { passive: true });

/* ---------- Start ---------- */
(() => {
  const h = (location.hash || '').slice(1);
  if (h === 'minside') { S.role = 'beboer'; S.view = 'minside'; }
  else if (NAV_STYRE.some(n => n.id === h)) S.view = h;
  render();
})();
</script>
</body>
</html>
